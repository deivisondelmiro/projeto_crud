<svg width="220" height="60" viewBox="0 0 220 60" xmlns="http://www.w3.org/2000/svg">
  
  <!-- Gradiente -->
  <defs>
    <linearGradient id="grad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff2d20;stop-opacity:1"></stop>
      <stop offset="100%" style="stop-color:#ff6b4a;stop-opacity:1"></stop>
    </linearGradient>
  </defs>

  <!-- Ícone -->
  <g transform="translate(10,10)">
    
    <!-- Livro -->
    <rect x="5" y="20" width="35" height="20" rx="3" fill="#2d3748"></rect>
    
    <!-- Página -->
    <line x1="22.5" y1="20" x2="22.5" y2="40" stroke="#ffffff" stroke-width="1.5"></line>

    <!-- Chapéu de formatura -->
    <polygon points="0,18 22.5,8 45,18 22.5,28" fill="url(#grad1)"></polygon>

    <!-- Base do chapéu -->
    <rect x="14" y="27" width="17" height="3" fill="#ff2d20"></rect>

    <!-- Tassel -->
    <line x1="33" y1="18" x2="33" y2="28" stroke="#ff2d20" stroke-width="2"></line>
    <circle cx="33" cy="30" r="2" fill="#ff2d20"></circle>

  </g>

  <!-- Texto -->
  <text x="65" y="38" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="bold" fill="#2d3748">
    CourseHub
  </text>

</svg>